<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花蓮分院音控室</title>
<meta name="theme-color" content="#f8f8fa">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fafafa;--ink:#222;--acc:#3a6ea5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus{outline:none}
button:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
button[aria-pressed=true]{color:var(--acc);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.3em}
a{color:var(--acc)}
#app{max-width:34em;margin:0 auto;padding:1em 1.25em 3em}
.top{display:flex;gap:1.25em;align-items:baseline;margin-bottom:1.5em}
.quiet{opacity:.6}
h1{font-size:1.7em;font-weight:600;line-height:1.3;margin:.2em 0 .8em}
.opts button{display:block;width:100%;font-size:1.3em;padding:.55em 0;border-top:1px solid var(--ink)}
.opts button:last-child{border-bottom:1px solid var(--ink)}
.yn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.yn button{font-size:1.6em;padding:.6em 0;text-align:center}
.yn button+button{border-left:1px solid var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.2em 1em;margin:0 0 1.5em}
dt{opacity:.6}
dd{margin:0}
.foot{display:flex;flex-wrap:wrap;gap:.5em 1.25em;align-items:center;margin-top:2.5em}
.foot label{display:flex;align-items:center;gap:.5em}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:7em;height:1.5em;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;margin-top:-9px;background:var(--acc);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--acc);border:0;border-radius:0}

@media print{
 @page{size:A4;margin:15mm}
 :root{--bg:#fff!important;--ink:#000!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{font-size:12pt}
 .top,.foot,.yn,.opts{display:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem('hav.' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('hav.' + k, JSON.stringify(v)); } catch(e){} }
};
let dark0 = false;
try { dark0 = matchMedia('(prefers-color-scheme: dark)').matches; } catch(e){}
const S = {
  screen: 'home', hist: [], tune: false,
  dark: store.get('dark', dark0), hue: store.get('hue', 250), chroma: store.get('chroma', 0.12),
  sym: null, q: null, loc: null, dev: null,

};
let SYS, DEV = {}, LINKS = [];

function paint(){
  const h = S.hue, c = S.chroma, r = document.documentElement.style;
  r.setProperty('--bg', S.dark ? `oklch(0.17 0.008 ${h})` : `oklch(0.985 0.006 ${h})`);
  r.setProperty('--ink', S.dark ? `oklch(0.92 0.006 ${h})` : `oklch(0.22 0.01 ${h})`);
  r.setProperty('--acc', S.dark ? `oklch(0.78 ${c} ${h})` : `oklch(0.55 ${c} ${h})`);
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = S.dark ? '#1b1d21' : '#f8f8fa';
}
const label = id => (SYS.labels[id] || DEV[id]?.name || DEV[id]?.item || id);
const typeName = t => SYS.types[t] || t;
const sp = t => (/^[A-Za-z0-9]/.test(t) ? ' ' : '') + t + (/[A-Za-z0-9]$/.test(t) ? ' ' : '');
const FLOORS = ['一樓','二樓','三樓','四樓'];
const locKey = l => { const i = FLOORS.indexOf((l || '').slice(0, 2)); return (i < 0 ? 9 : i) + (l || ''); };
const locName = l => (l || '未標位置').replace(/\s+/g, '');
const B = (txt, act, val = '', extra = '') => `<button type="button" data-act="${act}" data-val="${esc(val)}" ${extra}>${esc(txt)}</button>`;
const top = (backTo = 'home') => `<div class="top">${B(backTo === 'home' ? '首頁' : '上一步', 'back')}</div>`;

/* ---------- 引導流程 ---------- */
const ups = (id, types) => [...new Set(LINKS.filter(l => l.to === id && types.includes(l.type)).map(l => l.from))];
function startFlow(sym){ S.sym = sym; S.q = { kind: 'check', node: sym.node, i: 0, n: 1 }; go('flow'); }
function after(q){
  const s = S.sym;
  if (q.rest && q.rest.length) return { kind: 'check', node: q.rest[0], i: 99, n: q.n + 1, down: q.down, rest: q.rest.slice(1) };
  if (s.path && q.i < s.path.length - 1) return { kind: 'check', node: s.path[q.i + 1], i: q.i + 1, n: q.n + 1, down: q.node };
  const u = ups(q.node, s.types);
  if (!u.length) return { kind: 'clear', n: q.n };
  if (u.length === 1) return { kind: 'check', node: u[0], i: 99, n: q.n + 1, down: q.node };
  return { kind: 'pick', node: q.node, opts: u, n: q.n + 1 };
}
function flow(){
  const q = S.q, d = DEV[q.node] || {};
  let h = top('prev') + `<p class="quiet">${esc(S.sym.name)}${q.kind === 'check' || q.kind === 'pick' ? `　第 ${q.n} 步` : ''}</p>`;
  if (q.kind === 'check') {
    h += `<h1>${esc(sp(label(q.node)).trimStart())}有開機、線有接好嗎？</h1>`;
    if (d.loc) h += `<p class="quiet">在${esc(locName(d.loc))}</p>`;
    h += `<div class="yn">${B('有', 'yes')}${B('沒有', 'no')}</div>`;
  } else if (q.kind === 'pick') {
    h += `<h1>${esc(sp(label(q.node)).trimStart())}的訊號是從哪裡來的？</h1><div class="opts">` + q.opts.map(id => B(label(id), 'pick', id)).join('') + B('不確定，全部檢查', 'pick', '*') + '</div>';
  } else if (q.kind === 'bad') {
    h += `<h1>問題可能在${esc(sp(label(q.node)).trimEnd())}</h1>` + facts(q.node);
    if (q.down) h += `<p>也可能是${esc(sp(label(q.node)))}接到${esc(sp(label(q.down)))}的那條線。</p>`;
    h += '<p>處理不了的話，請聯絡音控主責。</p><div class="opts">' + B('重新檢查', 'restart') + B('回首頁', 'home') + '</div>';
  } else if (q.kind === 'clear') {
    h += '<h1>這條路上的設備都有開、線也都接好</h1><p>請聯絡音控主責。</p><div class="opts">' + B('重新檢查', 'restart') + B('回首頁', 'home') + '</div>';
  }
  return h;
}
function facts(id){
  const d = DEV[id] || {}, r = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  return '<dl>' + r('位置', esc(locName(d.loc))) + r('品項', esc(d.item)) + r('型號', esc(d.model)) + r('狀態', esc(d.status))
    + r('備註', esc(d.note).replace(/\n/g, '<br>')) + r('說明書', d.manual ? `<a href="${esc(d.manual)}" target="_blank" rel="noopener">開啟</a>` : '')
    + r('相關', d.ref ? (/^https?:/.test(d.ref) ? `<a href="${esc(d.ref)}" target="_blank" rel="noopener">開啟</a>` : esc(d.ref)) : '') + '</dl>';
}

/* ---------- 各畫面 ---------- */
const screens = {
  home(){
    let h = '<h1>現在要做什麼？</h1><div class="opts">' + B('哪裡沒有聲音', 'go', 'sound') + B('哪裡沒有畫面', 'go', 'picture') + B('查設備', 'go', 'locs') + B('高階版：接線圖與完整清單', 'adv') + '</div>';
    h += '<div class="foot">' + B('夜間', 'dark', '', `aria-pressed="${S.dark}"`) + B('色彩', 'tune', '', `aria-pressed="${S.tune}"`);
    if (S.tune) h += `<label>色相<input type="range" min="0" max="360" step="1" value="${S.hue}" data-set="hue"></label><label>彩度<input type="range" min="0" max="0.25" step="0.005" value="${S.chroma}" data-set="chroma"></label>`;
    return h + '</div>';
  },
  sound(){ return top() + '<h1>哪裡沒有聲音？</h1><div class="opts">' + SYS.symptoms.sound.map((s, i) => B(s.name, 'sym', 'sound:' + i)).join('') + '</div>'; },
  picture(){ return top() + '<h1>哪裡沒有畫面？</h1><div class="opts">' + SYS.symptoms.picture.map((s, i) => B(s.name, 'sym', 'picture:' + i)).join('') + '</div>'; },
  flow,
  locs(){
    const locs = [...new Set(Object.values(DEV).map(d => d.loc).filter(Boolean))].sort((a, b) => locKey(a).localeCompare(locKey(b)));
    return top() + '<h1>設備在哪裡？</h1><div class="opts">' + locs.map(l => B(locName(l), 'loc', l)).join('') + '</div>';
  },
  devs(){
    const list = Object.entries(DEV).filter(([, d]) => d.loc === S.loc).sort((a, b) => label(a[0]).localeCompare(label(b[0]), 'zh-Hant'));
    return top('prev') + `<h1>${esc(locName(S.loc))}</h1><div class="opts">` + list.map(([id, d]) => B(label(id) + (d.status && d.status !== '正常' ? '　' + d.status : ''), 'dev', id)).join('') + '</div>';
  },
  dev(){
    const id = S.dev, ins = LINKS.filter(l => l.to === id), outs = LINKS.filter(l => l.from === id);
    let h = top('prev') + `<h1>${esc(label(id))}</h1>` + facts(id);
    const li = (ls, k, end) => ls.length ? `<p class="quiet">${k}</p><div class="opts">` + ls.map(l => B(`${label(l[end])}　${typeName(l.type)}`, 'dev', l[end])).join('') + '</div>' : '';
    return h + li(ins, '從這些設備接進來', 'from') + li(outs, '接出去到這些設備', 'to');
  },
};

function go(screen){ S.hist.push({ screen: S.screen, q: S.q, loc: S.loc, dev: S.dev }); S.screen = screen; render(); scrollTo(0, 0); }
function back(){
  const p = S.hist.pop();
  if (!p) { S.screen = 'home'; } else Object.assign(S, p);
  if (S.screen === 'home') S.hist = [];
  render(); scrollTo(0, 0);
}
function render(){
  paint();
  $('#app').innerHTML = screens[S.screen]();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !t.dataset.act) return;
  const a = t.dataset.act, v = t.dataset.val;
  if (a === 'go') go(v);
  else if (a === 'back') back();
  else if (a === 'home') { S.hist = []; S.screen = 'home'; render(); scrollTo(0, 0); }
  else if (a === 'adv') location.href = 'advanced.html';
  else if (a === 'sym') { const [k, i] = v.split(':'); startFlow(SYS.symptoms[k][+i]); }
  else if (a === 'yes') { S.hist.push({ screen: 'flow', q: S.q }); S.q = after(S.q); render(); scrollTo(0, 0); }
  else if (a === 'no') { S.hist.push({ screen: 'flow', q: S.q }); S.q = { ...S.q, kind: 'bad' }; render(); scrollTo(0, 0); }
  else if (a === 'pick') {
    S.hist.push({ screen: 'flow', q: S.q });
    if (v === '*') { const o = S.q.opts; S.q = { kind: 'check', node: o[0], i: 99, n: S.q.n, down: S.q.node, rest: o.slice(1) }; }
    else S.q = { kind: 'check', node: v, i: 99, n: S.q.n, down: S.q.node };
    render(); scrollTo(0, 0);
  }
  else if (a === 'restart') { const s = S.sym; S.hist = []; startFlow(s); S.hist = [{ screen: 'home' }]; }
  else if (a === 'loc') { S.loc = v; go('devs'); }
  else if (a === 'dev') { S.dev = v; go('dev'); }
  else if (a === 'dark') { S.dark = !S.dark; store.set('dark', S.dark); render(); }
  else if (a === 'tune') { S.tune = !S.tune; render(); }
});
document.addEventListener('input', e => { const k = e.target.dataset.set; if (!k) return; S[k] = +e.target.value; store.set(k, S[k]); paint(); });
Promise.all(['data/system.json', 'data/devices.json'].map(u => fetch(u).then(r => r.json()))).then(([sys, devs]) => {
  SYS = sys; LINKS = sys.links;
  devs.forEach(d => DEV[d.id] = d); sys.devices.forEach(d => DEV[d.id] = d);
  render();
}).catch(() => { $('#app').textContent = '資料載入失敗，請重新整理'; });
})();
</script>
</body>
</html>
